# Runs the backend tests on every push to the oja branch that touches the backend.
# The tests use an in-memory database and a fake LLM/speech provider: no secrets, database or network.
name: Backend tests

on:
  push:
    branches: [oja]
    paths:
      - "server/**"
      - "requirements.txt"
      - "alembic.ini"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: server
        run: python -m unittest discover -s tests -t . -v
