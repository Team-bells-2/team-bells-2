services:
  - type: web
    name: merchantpal-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SABIMARKET_DB_PATH
        value: /var/data/merchantpal.sqlite3
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: merchantpal-data
      mountPath: /var/data
      sizeGB: 1