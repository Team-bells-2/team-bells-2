# Deploys the OJA API in server/ with a managed PostgreSQL database.
# Render gives DATABASE_URL as postgresql://...; the server uses the psycopg (v3) driver,
# so each command rewrites the scheme to postgresql+psycopg:// first.
# Secrets (LLM_API_KEY, STT_API_KEY) are entered in the Render dashboard (sync: false).
databases:
  - name: oja-db
    plan: free
    databaseName: oja
    user: oja_user

services:
  - type: web
    name: oja-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Migrations, then the reference data (markets and demo suppliers; safe to rerun).
    preDeployCommand: >-
      export DATABASE_URL="$(echo "$DATABASE_URL" | sed -E 's#^postgres(ql)?://#postgresql+psycopg://#')"
      && alembic upgrade head
      && cd server && python -m app.demo.index
    # One worker: the WebSocket hub is in memory.
    startCommand: >-
      export DATABASE_URL="$(echo "$DATABASE_URL" | sed -E 's#^postgres(ql)?://#postgresql+psycopg://#')"
      && cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: oja-db
          property: connectionString
      - key: DB_ECHO
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      # LLM (OpenAI-compatible chat completions)
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_TIMEOUT_SECONDS
        value: "15"
      - key: LLM_MAX_TOKENS
        value: "400"
      - key: LLM_RATE_LIMIT_DEFAULT_WAIT_SECONDS
        value: "1.5"
      - key: LLM_RATE_LIMIT_MAX_WAIT_SECONDS
        value: "3"
      # Speech-to-text: hosted Whisper (no Whisper install on Render)
      - key: STT_BASE_URL
        value: https://api.openai.com
      - key: STT_INFERENCE_PATH
        value: /v1/audio/transcriptions
      - key: STT_API_KEY
        sync: false
      - key: STT_MODEL
        value: whisper-1
      - key: STT_TIMEOUT_SECONDS
        value: "30"
      - key: STT_MAX_UPLOAD_MB
        value: "15"
      # Ledger and matching thresholds (same as .env.example)
      - key: CONFIDENCE_THRESHOLD
        value: "0.7"
      - key: CUSTOMER_MATCH_LINK_CONFIDENCE
        value: "0.85"
      - key: CUSTOMER_MATCH_CONFIRM_CONFIDENCE
        value: "0.5"
      - key: ITEM_MATCH_LINK_CONFIDENCE
        value: "0.85"
      - key: ITEM_MATCH_CONFIRM_CONFIDENCE
        value: "0.5"
      # Restock ranking
      - key: SUGGESTION_WEIGHT_DISTANCE
        value: "0.25"
      - key: SUGGESTION_WEIGHT_RATING
        value: "0.2"
      - key: SUGGESTION_WEIGHT_QUALITY
        value: "0.15"
      - key: SUGGESTION_WEIGHT_COST
        value: "0.25"
      - key: SUGGESTION_WEIGHT_QUANTITY
        value: "0.15"
      - key: SUGGESTION_DISTANCE_HALF_KM
        value: "10"
      - key: SUGGESTION_QUALITY_SCORE_A
        value: "1.0"
      - key: SUGGESTION_QUALITY_SCORE_B
        value: "0.7"
      - key: SUGGESTION_QUALITY_SCORE_C
        value: "0.4"
      # Demo and access control. Demo controls stay off on a shared deployment.
      # DEMO_MODE=true reads messages with built-in rules and makes no model calls, so the app
      # works with no API key. After entering LLM_API_KEY (and STT_API_KEY), set it to "false".
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_CONTROLS_ENABLED
        value: "false"
      - key: SESSION_TOKEN_TTL_DAYS
        value: "30"
      - key: AUTH_MAX_FAILED_LOGINS
        value: "5"
      - key: AUTH_LOCK_MINUTES
        value: "5"
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "43200"
      - key: CORS_ORIGINS
        value: "[]"
