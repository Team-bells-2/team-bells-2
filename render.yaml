services:
  - type: web
    name: oja-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SABIMARKET_DB_PATH
        value: /var/data/oja.sqlite3
      - key: WHISPER_CACHE_DIR
        value: /var/data/whisper-models
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: oja-data
      mountPath: /var/data
      sizeGB: 1